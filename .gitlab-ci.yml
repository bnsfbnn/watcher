image: eclipse-temurin:8-jdk

stages:
  - validate
  - build
  - package

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle/wrapper

validate:
  stage: validate
  script:
    - sh ./gradlew --version
    - sh ./gradlew projects

build:
  stage: build
  script:
    - sh ./gradlew clean build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - services/*/build/libs/*.jar

docker-images:
  stage: package
  image: docker:25
  services:
    - docker:25-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f services/ingestion-service/Dockerfile -t "$CI_REGISTRY_IMAGE/ingestion-service:$CI_COMMIT_SHORT_SHA" .
    - docker build -f services/processing-service/Dockerfile -t "$CI_REGISTRY_IMAGE/processing-service:$CI_COMMIT_SHORT_SHA" .
    - docker build -f services/query-service/Dockerfile -t "$CI_REGISTRY_IMAGE/query-service:$CI_COMMIT_SHORT_SHA" .
    - docker build -f services/dashboard-service/Dockerfile -t "$CI_REGISTRY_IMAGE/dashboard-service:$CI_COMMIT_SHORT_SHA" .
    - docker build -f services/alerting-service/Dockerfile -t "$CI_REGISTRY_IMAGE/alerting-service:$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: '$CI_REGISTRY_IMAGE'
