version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.22
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: watcher
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    depends_on:
      - kafka
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WATCHER_INGESTION_API_KEY: dev-api-key
      WATCHER_RAW_TOPIC: raw_logs
    ports:
      - "8080:8080"

  processing-service:
    build:
      context: .
      dockerfile: services/processing-service/Dockerfile
    depends_on:
      - kafka
      - elasticsearch
      - redis
      - rabbitmq
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      WATCHER_RAW_TOPIC: raw_logs
      WATCHER_ALERT_ERROR_THRESHOLD: 1
    ports:
      - "8081:8081"

  query-service:
    build:
      context: .
      dockerfile: services/query-service/Dockerfile
    depends_on:
      - elasticsearch
    restart: unless-stopped
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8082:8082"

  dashboard-service:
    build:
      context: .
      dockerfile: services/dashboard-service/Dockerfile
    depends_on:
      - kafka
      - postgres
      - redis
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: watcher
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
      SPRING_REDIS_HOST: redis
      WATCHER_LIVE_TOPIC: raw_logs
    ports:
      - "8083:8083"

  alerting-service:
    build:
      context: .
      dockerfile: services/alerting-service/Dockerfile
    depends_on:
      - rabbitmq
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      WATCHER_EMAIL_SINK: console
    ports:
      - "8084:8084"

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - ingestion-service
      - query-service
      - dashboard-service
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  elasticsearch-data:
  postgres-data:
